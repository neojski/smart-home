name: CI

on: [push]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: install
        run: npm ci

      - name: check compilation
        run: npm run check-compilation

      - name: test
        run: npm test

      # Runs esbuild, so a bump to esbuild or typescript that leaves the two
      # unable to parse the same source fails here rather than during deploy.
      - name: build
        run: npm run ui-build
